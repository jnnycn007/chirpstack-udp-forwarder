[package]
  name = "chirpstack-udp-forwarder"
  description = "ChirpStack UDP Forwarder for Concentratord, compatible with the Semtech UDP protocol"
  repository = "https://github.com/chirpstack/chirpstack-udp-forwarder/"
  license = "MIT"
  version = "4.3.0"
  authors = ["Orne Brocaar <info@brocaar.com>"]
  edition = "2024"
  publish = false

[dependencies]
  lrwn_filters = { version = "4.16", features = ["serde"] }
  chirpstack_api = { version = "4.19", default-features = false }
  serde_json = "1.0"
  zmq = "0.10"
  clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "derive",
  ] }
  hex = "0.4"
  toml = { version = "1.1", default-features = false, features = [
    "std",
    "parse",
    "serde",
  ] }
  serde = { version = "1.0", features = ["derive"] }
  log = "0.4"
  simple_logger = { version = "5.2", default-features = false, features = [
    "timestamps",
  ] }
  uuid = { version = "1.24", features = ["v4"] }
  syslog = "7.0"
  getrandom = { version = "0.4", features = ["std"] }
  chrono = { version = "0.4", default-features = false, features = ["now"] }
  base64 = "0.23"
  prometheus-client = "0.25"
  anyhow = "1.0"
  thiserror = "2.0"

  [package.metadata.deb]
    assets = [
      [
        "target/release/chirpstack-udp-forwarder",
        "usr/bin/",
        "755",
      ],
      [
        "packaging/debian/chirpstack-udp-forwarder.toml",
        "etc/chirpstack-udp-forwarder/",
        "640",
      ],
    ]
    conf-files = ["/etc/chirpstack-udp-forwarder/chirpstack-udp-forwarder.toml"]
    maintainer-scripts = "packaging/debian/"
    systemd-units = { enable = true }

[profile.release]
  strip = true
  opt-level = "z"
  lto = true
  codegen-units = 1
  panic = "abort"
